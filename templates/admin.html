<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>
    <div class="d-flex w-100 h-100 justify-content-center">
        <div class="container w-100 overflow-y-auto h-sm-100">
            <div class="text-center mt-3">
                <img class="seal" width="80px" src="/static/images/Basilan_State_University.svg.webp" alt="#">
            </div>

            <div class="text-center">
                <h1>CCS Phoenix</h1>
                <p>Admin Approval Center</p>
            </div>

            <div id="request" class="w-100 p-3">
                <div class="empty h-100 p-3">
                    <div class="d-flex h-100 justify-content-center align-items-center flex-column">
                        <div class="mt-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#e8d9f0bb"
                                class="bi bi-envelope-arrow-down-fill" viewBox="0 0 16 16">
                                <path
                                    d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zm.192 8.159 6.57-4.027L8 9.586l1.239-.757.367.225A4.49 4.49 0 0 0 8 12.5c0 .526.09 1.03.256 1.5H2a2 2 0 0 1-1.808-1.144M16 4.697v4.974A4.5 4.5 0 0 0 12.5 8a4.5 4.5 0 0 0-1.965.45l-.338-.207z" />
                                <path
                                    d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.354-1.646a.5.5 0 0 1-.722-.016l-1.149-1.25a.5.5 0 1 1 .737-.676l.28.305V11a.5.5 0 0 1 1 0v1.793l.396-.397a.5.5 0 0 1 .708.708z" />
                            </svg>
                        </div>
                        <div class="text-center">
                            <h4 class="m-0">All Clear</h4>
                            <p class="m-0">No pending message at this time. The phoenix watches over a peaceful realm.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="table-responsive" id="requests-table">
                    <h4 id="pending-message" class="mb-3">Pending Messages (0)</h4>
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">SENDER</th>
                                <th scope="col">COURSES</th>
                                <th scope="col">YEAR</th>
                                <th scope="col">MESSAGES</th>
                                <th scope="col">SUBMITTED</th>
                                <th scope="col">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="footer text-center mt-2">
                <p>Auto refreshing every 5 seconds</p>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>

</html>
